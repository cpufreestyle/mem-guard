name: CI

# push / PR 就跑：版本闸门 + 单元测试。发布只在 release.yml（推 tag）里发生，
# 所以这里不碰打包，跑得快、失败也反馈得早。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    env:
      # Windows runner 默认不是 UTF-8，脚本打印中文会 UnicodeEncodeError 并让检查退出码为 1
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 版本与交接文档一致性
        run: python check_version_sync.py

      - name: 提交内容行尾 / BOM / 编码
        run: python check_line_endings.py

      - name: 运行单元测试
        run: python -m pytest -q

      - name: 运行自检
        run: python mem_guard.py --selftest

