name: Build release

# 推 tag（如 v1.3.0）时自动打包并发布 Release；也可在 Actions 页手动触发
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # softprops/action-gh-release 需要写权限创建 Release

jobs:
  build:
    runs-on: windows-latest
    env:
      # Windows runner 默认不是 UTF-8，脚本打印中文会 UnicodeEncodeError 并让自检退出码为 1
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pyinstaller

      - name: 生成程序图标
        run: python make_icon.py

      - name: 运行单元测试
        run: python -m pytest -q

      - name: 运行自检
        run: python mem_guard.py --selftest

      - name: 打包单文件 exe
        run: >
          python -m PyInstaller --noconsole --onefile --name mem_guard
          --icon mem_guard.ico --hidden-import pystray._win32 --clean
          --exclude-module numpy --exclude-module pandas --exclude-module matplotlib
          --exclude-module scipy --exclude-module pytest --exclude-module setuptools
          mem_guard.py

      - name: 冒烟测试产物
        run: |
          # GUI 子系统的 exe 没有控制台输出，且 $LASTEXITCODE 不可靠，
          # 因此用 Start-Process -Wait -PassThru 取退出码，并让自检把明细写到文件
          $env:MEMGUARD_SELFTEST_LOG = "$PWD\selftest.log"
          $p = Start-Process -FilePath 'dist\mem_guard.exe' -ArgumentList '--selftest' -Wait -PassThru
          if (Test-Path selftest.log) { Get-Content selftest.log }
          Write-Host "冒烟退出码: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) {
            $detail = if (Test-Path selftest.log) { (Get-Content selftest.log -Raw) } else { '(无自检日志)' }
            $flat = (($detail -split "`r?`n" | Select-Object -First 15) -join ' | ')
            Write-Host "::error title=产物冒烟测试失败::exit=$($p.ExitCode) $flat"
            exit 1
          }

      - name: 安装 Inno Setup
        continue-on-error: true
        run: choco install innosetup -y --no-progress

      - name: 编译安装器
        shell: pwsh
        run: |
          # 版本号从 config.py 动态读取，避免发版时忘记同步安装器版本
          $iscc = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host "::warning title=跳过安装器::未找到 ISCC.exe（Inno Setup 未安装成功）"
            exit 0
          }
          $ver = (Select-String -Path memguard\config.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          Write-Host "编译安装器，版本 $ver"
          & $iscc "/DAppVersion=$ver" "installer\mem_guard.iss"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error title=安装器编译失败::ISCC 退出码 $LASTEXITCODE"
            exit 1
          }
          Get-ChildItem dist\MemGuard-Setup-*.exe | ForEach-Object { Write-Host ("产物: " + $_.Name) }

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: mem_guard-exe
          path: |
            dist/mem_guard.exe
            dist/MemGuard-Setup-*.exe
          if-no-files-found: warn

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mem_guard.exe
            dist/MemGuard-Setup-*.exe
          generate_release_notes: true
