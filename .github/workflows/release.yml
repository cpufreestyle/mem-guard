name: Build release

# 推 tag（如 v1.3.0）时自动打包并发布 Release；也可在 Actions 页手动触发
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # softprops/action-gh-release 需要写权限创建 Release

jobs:
  build:
    runs-on: windows-latest
    env:
      # Windows runner 默认不是 UTF-8，脚本打印中文会 UnicodeEncodeError 并让自检退出码为 1
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 生成程序图标
        run: python make_icon.py

      - name: 运行自检
        run: python mem_guard.py --selftest

      - name: 打包单文件 exe
        run: >
          python -m PyInstaller --noconsole --onefile --name mem_guard
          --icon mem_guard.ico --hidden-import pystray._win32 --clean
          --exclude-module numpy --exclude-module pandas --exclude-module matplotlib
          --exclude-module scipy --exclude-module pytest --exclude-module setuptools
          mem_guard.py

      - name: 冒烟测试产物
        run: |
          # GUI 子系统的 exe 没有控制台输出，且 $LASTEXITCODE 不可靠，
          # 因此用 Start-Process -Wait -PassThru 取退出码，并让自检把明细写到文件
          $env:MEMGUARD_SELFTEST_LOG = "$PWD\selftest.log"
          $p = Start-Process -FilePath 'dist\mem_guard.exe' -ArgumentList '--selftest' -Wait -PassThru
          if (Test-Path selftest.log) { Get-Content selftest.log }
          Write-Host "冒烟退出码: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) {
            $detail = if (Test-Path selftest.log) { (Get-Content selftest.log -Raw) } else { '(无自检日志)' }
            $flat = (($detail -split "`r?`n" | Select-Object -First 15) -join ' | ')
            Write-Host "::error title=产物冒烟测试失败::exit=$($p.ExitCode) $flat"
            exit 1
          }

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: mem_guard-exe
          path: dist/mem_guard.exe
          if-no-files-found: error

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/mem_guard.exe
          generate_release_notes: true
